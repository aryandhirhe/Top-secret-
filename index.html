<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #060606;
    --paper: #ffffff;
    --ink: #211d18;
    --ink-dim-on-black: rgba(239,236,228,0.45);
    --ink-soft: rgba(33,29,24,0.55);
    --gold-deep: #b8863a;
    --gold: #d9b463;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    overflow:hidden;
    font-family:'Cormorant Garamond', serif;
  }

  body{
    position:relative;
    background: var(--black);
    transition: background-color 0.1s linear;
  }
  body.phase-birthday{ background: var(--paper); }

  .screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ===== Entry screen ===== */
  #screen-entry{
    flex-direction:column;
  }

  .glow{
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(201,162,74,0.07) 0%, rgba(201,162,74,0) 70%);
    animation: breathe 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%, 100% { opacity:0.5; transform:scale(1); }
    50% { opacity:1; transform:scale(1.08); }
  }

  .gate{
    position:relative;
    width:190px; height:190px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    background:none; border:none; outline:none;
    -webkit-tap-highlight-color: transparent;
  }
  .gate svg{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    transform: rotate(-90deg);
  }
  .gate circle{ fill:none; stroke-width:1; }
  .ring-base{ stroke: rgba(239,236,228,0.18); }
  .ring-draw{
    stroke: var(--gold);
    stroke-dasharray: 553;
    stroke-dashoffset: 553;
    transition: stroke-dashoffset 0.7s cubic-bezier(0.65,0,0.35,1);
  }
  .gate:hover .ring-draw, .gate:focus-visible .ring-draw{ stroke-dashoffset: 0; }

  .label{
    position:relative; z-index:2;
    font-weight:400; font-size:1.05rem;
    letter-spacing:0.42em; text-transform:uppercase;
    color: var(--ink-dim-on-black);
    transition: color 0.5s ease, letter-spacing 0.5s ease;
  }
  .gate:hover .label, .gate:focus-visible .label{
    color: #efece4; letter-spacing:0.5em;
  }

  .hint{
    position:absolute; bottom:9vh; left:0; right:0;
    text-align:center;
    font-size:0.72rem; letter-spacing:0.28em; text-transform:uppercase;
    color: rgba(239,236,228,0.28);
    animation: flicker 4s ease-in-out infinite;
  }
  @keyframes flicker{ 0%,100%{opacity:0.35;} 50%{opacity:0.7;} }

  /* ===== Birthday screen ===== */
  #screen-birthday{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:8vh 20px 7vh;
  }
  #screen-birthday.playing{ display:flex; }

  .spark{
    position:absolute; border-radius:50%;
    background: var(--gold);
    opacity:0;
    animation: drift 7s ease-in infinite;
  }
  .spark:nth-child(1){ width:5px; height:5px; left:18%; animation-delay:0.3s; }
  .spark:nth-child(2){ width:4px; height:4px; left:32%; animation-delay:1.6s; }
  .spark:nth-child(3){ width:6px; height:6px; left:68%; animation-delay:0.8s; }
  .spark:nth-child(4){ width:4px; height:4px; left:78%; animation-delay:2.4s; }
  .spark:nth-child(5){ width:5px; height:5px; left:50%; animation-delay:3.1s; }
  @keyframes drift{
    0%{ transform: translateY(10vh) scale(0.6); opacity:0; }
    15%{ opacity:0.65; }
    85%{ opacity:0.4; }
    100%{ transform: translateY(-95vh) scale(1); opacity:0; }
  }

  .photo-wrap{
    position:relative;
    width:260px; height:260px;
    opacity:0;
    transform: scale(0.35) rotate(-8deg);
  }
  .playing .photo-wrap{
    animation: arrive 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.25) 0.15s forwards;
  }
  @keyframes arrive{ to{ opacity:1; transform: scale(1) rotate(0deg); } }

  .photo-wrap svg{
    position:absolute; top:-10px; left:-10px;
    width:280px; height:280px;
    transform: rotate(-90deg);
  }
  .photo-wrap circle{
    fill:none; stroke-width:1.5; stroke: var(--gold-deep);
    stroke-dasharray: 815; stroke-dashoffset: 815;
  }
  .playing .photo-wrap circle{
    animation: ring-draw 1s ease-out 0.55s forwards;
  }
  @keyframes ring-draw{ to{ stroke-dashoffset:0; } }

  .photo{
    width:100%; height:100%;
    border-radius:50%; overflow:hidden;
    box-shadow: 0 18px 40px rgba(33,29,24,0.14);
    background: linear-gradient(160deg, #f6f1e6, #ece3d1);
    display:flex; align-items:center; justify-content:center;
  }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo .fallback{
    font-style:italic; font-size:0.95rem;
    color: var(--ink-soft); letter-spacing:0.05em;
    text-align:center; padding:0 20px;
  }

  .headline{
    margin-top:38px;
    font-family:'Great Vibes', cursive;
    font-size:4.2rem; line-height:1;
    background: linear-gradient(100deg, var(--gold-deep), #e7c680 45%, var(--gold-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity:0; transform: translateY(16px);
  }
  .playing .headline{ animation: rise 0.8s ease-out 1.1s forwards; }

  .caption{
    margin-top:6px;
    font-size:1.05rem; font-style:italic; letter-spacing:0.12em;
    color: var(--ink-soft);
    opacity:0; transform: translateY(10px);
  }
  .playing .caption{ animation: rise 0.8s ease-out 1.4s forwards; }

  @keyframes rise{ to{ opacity:1; transform: translateY(0); } }

  /* ===== Memories gallery ===== */
  .divider{
    display:flex; align-items:center; justify-content:center;
    gap:14px;
    margin-top:100px;
    width:100%; max-width:280px;
    opacity:0; transform: translateY(10px);
  }
  .playing .divider{ animation: rise 0.8s ease-out 1.7s forwards; }
  .divider-line{
    flex:1; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
  }
  .divider-dot{
    width:5px; height:5px; border-radius:50%;
    background: var(--gold-deep);
    flex-shrink:0;
  }

  .gallery-label{
    margin-top:12px;
    font-size:0.72rem;
    letter-spacing:0.34em;
    text-transform:uppercase;
    color: var(--ink-soft);
    opacity:0; transform: translateY(10px);
  }
  .playing .gallery-label{ animation: rise 0.8s ease-out 1.85s forwards; }

  @keyframes rise-scale{ to{ opacity:1; transform: translateY(0) scale(1); } }

  /* -- photo row: three small squares -- */
  .gallery-photos{
    margin-top:26px;
    width:100%;
    max-width:250px;
    margin-left:auto; margin-right:auto;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:9px;
  }

  .photo-tile{
    position:relative;
    aspect-ratio: 1 / 1;
    border-radius:9px;
    overflow:hidden;
    background:#faf7f1;
    border:1px solid rgba(184,134,58,0.26);
    box-shadow: 0 3px 9px rgba(33,29,24,0.07);
    opacity:0;
    transform: translateY(12px) scale(0.94);
  }
  .playing .gallery-photos .photo-tile{ animation: rise-scale 0.6s ease-out forwards; }
  .playing .gallery-photos .photo-tile:nth-child(1){ animation-delay:2.00s; }
  .playing .gallery-photos .photo-tile:nth-child(2){ animation-delay:2.10s; }
  .playing .gallery-photos .photo-tile:nth-child(3){ animation-delay:2.20s; }

  .photo-tile img{ width:100%; height:100%; object-fit:cover; display:block; }

  .photo-tile .fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-tile .fallback svg{ width:20px; height:20px; opacity:0.4; }

  /* -- video row: matches the photo row -- */
  .gallery-videos{
    margin-top:14px;
    width:100%;
    max-width:250px;
    margin-left:auto; margin-right:auto;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:9px;
  }

  .video-tile{
    position:relative;
    aspect-ratio: 1 / 1;
    border-radius:9px;
    overflow:hidden;
    background:#faf7f1;
    border:1px solid rgba(184,134,58,0.26);
    box-shadow: 0 3px 9px rgba(33,29,24,0.07);
    opacity:0;
    transform: translateY(12px) scale(0.94);
  }
  .playing .gallery-videos .video-tile{ animation: rise-scale 0.6s ease-out forwards; }
  .playing .gallery-videos .video-tile:nth-child(1){ animation-delay:2.35s; }
  .playing .gallery-videos .video-tile:nth-child(2){ animation-delay:2.45s; }
  .playing .gallery-videos .video-tile:nth-child(3){ animation-delay:2.55s; }

  .video-tile video{ width:100%; height:100%; object-fit:cover; display:block; background:#000; }

  .video-tile .fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .video-tile .fallback .play-icon{
    width:24px; height:24px; border-radius:50%;
    background: rgba(184,134,58,0.14);
    display:flex; align-items:center; justify-content:center;
  }
  .video-tile .fallback .play-icon svg{ width:9px; height:9px; margin-left:1px; }

  /* ===== Transition veil ===== */
  .veil{
    position:fixed; inset:0;
    background: var(--black);
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.9s ease;
  }
  .veil.active{ opacity:1; pointer-events:all; }

  @media (max-width: 480px){
    .photo-wrap{ width:200px; height:200px; }
    .photo-wrap svg{ width:220px; height:220px; }
    .photo-wrap circle{ stroke-dasharray: 660; stroke-dashoffset:660; }
    .headline{ font-size:3.1rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .glow, .hint, .spark{ animation:none; }
    .ring-draw, .label{ transition:none; }
    .playing .photo-wrap, .playing .photo-wrap circle, .playing .headline, .playing .caption{
      animation:none; opacity:1; transform:none; stroke-dashoffset:0;
    }
  }
</style>
</head>
<body class="phase-entry">

  <section class="screen" id="screen-entry">
    <div class="glow"></div>
    <button class="gate" id="gate" aria-label="Enter">
      <svg viewBox="0 0 190 190">
        <circle class="ring-base" cx="95" cy="95" r="88"></circle>
        <circle class="ring-draw" cx="95" cy="95" r="88"></circle>
      </svg>
      <span class="label">Enter</span>
    </button>
    <p class="hint">The site awaits</p>
  </section>

  <section class="screen" id="screen-birthday">
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <div class="photo-wrap">
      <svg viewBox="0 0 280 280">
        <circle cx="140" cy="140" r="130"></circle>
      </svg>
      <div class="photo">
        <!-- Replace src below with the real photo -->
        <img src="photo.jpg" alt="Birthday photo" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='block';">
        <span class="fallback" style="display:none;">Add photo.jpg<br>next to this file</span>
      </div>
    </div>

    <h1 class="headline">Happy Birthday</h1>
    <p class="caption">make a wish</p>

    <div class="divider" aria-hidden="true">
      <span class="divider-line"></span>
      <span class="divider-dot"></span>
      <span class="divider-line"></span>
    </div>
    <p class="gallery-label">memories</p>

    <div class="gallery-photos">
      <div class="photo-tile" title="photo2.jpg">
        <img src="photo2.jpg" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="fallback" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b8863a" stroke-width="1.3"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.4-2h5.2L16 6"/></svg>
        </span>
      </div>
      <div class="photo-tile" title="photo3.jpg">
        <img src="photo3.jpg" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="fallback" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b8863a" stroke-width="1.3"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.4-2h5.2L16 6"/></svg>
        </span>
      </div>
      <div class="photo-tile" title="photo4.jpg">
        <img src="photo4.jpg" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="fallback" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b8863a" stroke-width="1.3"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.4-2h5.2L16 6"/></svg>
        </span>
      </div>
    </div>

    <div class="gallery-videos">
      <div class="video-tile" title="video1.mp4">
        <video autoplay muted loop playsinline preload="auto" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <source src="video1.mp4" type="video/mp4">
        </video>
        <span class="fallback" style="display:none;">
          <span class="play-icon"><svg viewBox="0 0 24 24" fill="#b8863a"><path d="M8 5v14l11-7z"/></svg></span>

        </span>
      </div>
      <div class="video-tile" title="video2.mp4">
        <video autoplay muted loop playsinline preload="auto" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <source src="video2.mp4" type="video/mp4">
        </video>
        <span class="fallback" style="display:none;">
          <span class="play-icon"><svg viewBox="0 0 24 24" fill="#b8863a"><path d="M8 5v14l11-7z"/></svg></span>

        </span>
      </div>
      <div class="video-tile" title="video3.mp4">
        <video autoplay muted loop playsinline preload="auto" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <source src="video3.mp4" type="video/mp4">
        </video>
        <span class="fallback" style="display:none;">
          <span class="play-icon"><svg viewBox="0 0 24 24" fill="#b8863a"><path d="M8 5v14l11-7z"/></svg></span>

        </span>
      </div>
    </div>
  </section>

  <canvas id="confetti-canvas" style="position:fixed; inset:0; z-index:40; pointer-events:none;"></canvas>

  <div class="veil" id="veil"></div>

  <script>
    const gate = document.getElementById('gate');
    const veil = document.getElementById('veil');
    const screenEntry = document.getElementById('screen-entry');
    const screenBirthday = document.getElementById('screen-birthday');

    gate.addEventListener('click', () => {
      veil.classList.add('active');
      setTimeout(() => {
        screenEntry.style.display = 'none';
        document.body.classList.remove('phase-entry');
        document.body.classList.add('phase-birthday');
        screenBirthday.classList.add('playing');
        veil.classList.remove('active');
        launchConfetti();

        document.querySelectorAll('.gallery-videos video').forEach(v => {
          v.play().catch(() => {});
        });
      }, 900);
    });

    // ===== Confetti burst =====
    function launchConfetti(){
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#d9b463', '#b8863a', '#e8c9c0', '#f3ece1', '#c9a24a', '#f0d9b5'];
      const shapes = ['rect', 'circle'];
      const count = window.innerWidth < 480 ? 90 : 150;
      const particles = [];

      for (let i = 0; i < count; i++){
        particles.push({
          x: Math.random() * canvas.width,
          y: -30 - Math.random() * canvas.height * 0.6,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 10,
          shape: shapes[Math.floor(Math.random() * shapes.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 8,
          speedY: 2 + Math.random() * 2.6,
          swing: Math.random() * Math.PI * 2,
          swingSpeed: 0.02 + Math.random() * 0.02,
          opacity: 1
        });
      }

      let start = null;
      const duration = 3400;

      function frame(ts){
        if (!start) start = ts;
        const elapsed = ts - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          p.y += p.speedY;
          p.swing += p.swingSpeed;
          p.x += Math.sin(p.swing) * 1.3;
          p.rot += p.rotSpeed;
          if (elapsed > duration * 0.55){
            p.opacity = Math.max(0, p.opacity - 0.018);
          }

          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          if (p.shape === 'circle'){
            ctx.beginPath();
            ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          }
          ctx.restore();
        });

        if (elapsed < duration){
          requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
